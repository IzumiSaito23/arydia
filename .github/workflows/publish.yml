name: Publish web only
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: arydia-pages
  cancel-in-progress: false
jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble and verify browser files
        run: python3 web/scripts/assemble-pages.py
      - name: Check browser behavior and saved data compatibility
        run: |
          node web/scripts/check.cjs
          node web/scripts/campaign-check.cjs
          node web/scripts/release77-check.cjs
          node web/scripts/map78-check.cjs
          node web/scripts/search78-check.cjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deploy
