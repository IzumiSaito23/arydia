<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>阿瑞迪亚 · 战斗</title><link rel="stylesheet" href="combat.css"><link rel="stylesheet" href="viewport.css"><link rel="stylesheet" href="interaction-v2.css"></head><body>
<main id="combat"><header><button id="back" class="icon" aria-label="返回">‹</button><h1>战斗</h1><button id="add">选择敌人</button></header>
<nav id="tabs"><button data-page="field" aria-selected="true">战场</button><button data-page="models">敌人</button><button data-page="attacks">攻击轨迹</button></nav>
<section id="field"><div class="field-top"><span id="count">尚未选择敌人</span><button id="overview">总览</button></div><div id="stage" aria-label="左右拖动切换敌人"><div id="cards"></div><div id="empty"><span class="empty-mark">◇</span><h2>准备一场战斗</h2><p>输入实体卡上的敌人编号</p><button class="primary" data-page="models">选择敌人</button></div></div><div id="actor-meta"></div>
<section id="controls" class="attack-dock"><div class="dock-heading"><button id="direction" class="direction-chip">进入方向 · 北</button><span id="hint">选图案，再触碰血量点</span><button id="manual" aria-pressed="false">标记</button><button id="undo" class="icon" aria-label="撤销" disabled>↶</button></div><div id="weapon-tray" aria-label="攻击图案"></div><div class="result-row" id="forecast" hidden><div id="result"></div><button id="confirm" class="primary" disabled>确认攻击</button></div></section></section>
<section id="models" hidden><div class="search"><span>⌕</span><input id="model-search" placeholder="输入敌人编号" inputmode="numeric" aria-label="敌人编号"></div><p class="subtle">选择本场敌人后查看卡面</p><div id="model-grid"></div></section>
<section id="attacks" hidden><div class="section-head"><h2>我的攻击</h2><button id="new-attack" class="primary">新建轨迹</button></div><div id="attack-list"></div></section>
<section id="editor" hidden><div class="editor-head"><input id="attack-name" maxlength="40" aria-label="攻击名称" placeholder="攻击名称"><button id="save-attack" class="primary">保存</button></div><svg id="builder" viewBox="-250 -250 500 500" aria-label="拖动节点创建攻击轨迹"></svg><div id="editor-help">从选中节点向八个方向拖动，松手添加下一击</div><div class="editor-tools"><div id="node-tiers"><button data-node-tier="0" aria-label="白色伤害节点"><span class="damage-dot white"></span></button><button data-node-tier="1" aria-label="灰色伤害节点"><span class="damage-dot gray"></span></button><button data-node-tier="2" aria-label="深色伤害节点"><span class="damage-dot dark"></span></button></div><button id="piercing" aria-pressed="false">穿透</button><button id="delete-node">删除此击</button></div><div class="editor-footer"><button id="aimed" aria-pressed="false">定向攻击</button><button id="builder-undo">撤回一步</button><button id="cancel-editor">取消</button></div></section>
</main><div id="modal" hidden><div class="scrim"></div><section class="sheet" role="dialog" aria-modal="true"><header><h2 id="modal-title"></h2><button id="close-modal" class="icon" aria-label="关闭">×</button></header><div id="modal-body"></div></section></div><div id="toast" role="status"></div>
<script src="data.js"></script><script src="engine.js"></script><script src="bridge.js"></script><script src="combat.js"></script></body></html>
