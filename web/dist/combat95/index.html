<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>阿瑞迪亚 · 战斗</title><link rel="stylesheet" href="scene97.css"></head><body>
<main id="combat"><header class="battle-header"><button id="back" class="icon" aria-label="返回地图"></button><button id="manage" class="battle-title" aria-label="管理本场敌人"><b id="count">0 名敌人</b><span aria-hidden="true">⌄</span></button><button id="tracks-entry" aria-label="展开攻击轨迹" aria-pressed="false">攻击轨迹</button><span class="header-spacer"></span><button id="session" class="icon session-chip" aria-label="局域网联机"></button><button id="settings" class="icon" aria-label="战斗设置"></button><button id="add" class="icon" aria-label="添加敌人"></button><button id="enemy-ai" class="ai-entry" aria-label="查看当前敌人的AI卡">AI 卡</button></header>
<section id="field"><div id="stage" aria-label="划过或点按即可攻击，双指缩放与移动"><div id="camera"><div id="cards"></div></div><canvas id="gesture-layer" aria-hidden="true"></canvas><div id="empty"><div class="empty-symbol"></div><h2>准备本场战斗</h2><p>输入实体卡上的敌人编号</p><form id="empty-entry"><input id="empty-code" aria-label="敌人编号" placeholder="例如 16" inputmode="numeric" autocomplete="off"><button class="primary">添加</button></form><p id="entry-error" role="status"></p></div></div>
<section id="track-dock" hidden><div id="attack-forecast" hidden><button id="cancel-track" class="icon" aria-label="取消攻击预览"></button><span id="forecast-copy" role="status"></span><button id="confirm-track" class="primary">确认攻击</button></div><div class="track-dock-head"><b>攻击轨迹</b><small>选择轨迹，再点命中点预览</small><button id="edit-tracks">管理</button><button id="close-tracks" class="icon" aria-label="收起攻击轨迹"></button></div><div id="track-tray"></div></section><div id="stage-view-tools" hidden><button id="zoom-out" class="icon" aria-label="缩小全部敌人"></button><button id="zoom-in" class="icon" aria-label="放大全部敌人"></button><button id="fit" class="icon" aria-label="全部敌人适合屏幕"></button></div>
<div id="focus-tools"><button id="undo" class="icon" aria-label="撤回当前敌人的上次攻击" disabled></button><div id="enemy-strip" aria-label="敌人顺位，点击切换"></div><button id="show-overview" class="icon" aria-label="查看全部敌人"></button><span id="scene-hint" class="sr-only" role="status"></span></div></section><section id="attacks" hidden><div class="section-head"><h2>我的攻击轨迹</h2><button id="new-attack" class="primary">新建</button></div><div id="attack-list"></div></section>
<section id="editor" hidden><div class="editor-head"><input id="attack-name" aria-label="轨迹名称" maxlength="40"><button id="save-attack" class="primary">保存</button></div><div class="builder-wrap"><svg id="builder" viewBox="-260 -350 520 700" aria-label="点节点选中、右侧改级、拖过节点涂改、点空位延伸；空白处拖动，双指缩放"></svg><div id="node-tiers"><button data-node-tier="0" aria-label="白色节点"></button><button data-node-tier="1" aria-label="灰色节点"></button><button data-node-tier="2" aria-label="深色节点"></button></div><span id="editor-help">选择起点</span></div><div class="editor-footer"><button id="builder-undo" class="icon" aria-label="撤回一步"></button><button id="delete-node" class="icon" aria-label="删除选中节点"></button><label class="switch-label">穿甲<button id="piercing" role="switch" aria-checked="false"><span></span></button></label><button id="aimed" class="icon" aria-label="选择起点与进入方向" aria-pressed="false"></button><button id="builder-fit" class="icon" aria-label="居中轨迹"></button></div></section></main>
<div id="modal" hidden><div class="scrim"></div><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header><button id="modal-back" class="icon" aria-label="返回上一级" hidden></button><h2 id="modal-title"></h2><button id="close-modal" class="icon" aria-label="关闭"></button></header><div id="modal-body"></div></section></div><div id="toast" role="status"></div><script src="data.js"></script><script src="ai-symbols.js"></script><script src="ai-cards.js"></script><script src="engine.js"></script><script src="engine97.js"></script><script src="bridge.js"></script><script src="combat.js"></script></body></html>
